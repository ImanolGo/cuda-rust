---
# Port of cutile-rs/.github/workflows/pr.yml for the monorepo.
# cutile-rs remains a nested Cargo workspace until workspace membership is
# reconciled, so cargo/script steps run under cutile-rs.
# Checkout does not init submodules. cuda-tile-rs is outside default-members,
# and these CUDA images have no git until the setup action, so
# `submodules: recursive` makes actions/checkout reject the REST API fallback.
name: cutile-rs-pr

on:
  # Self-hosted runners (linux-amd64-cpu16) cannot run on pull_request events —
  # see https://docs.gha-runners.nvidia.com/pull-request-testing/. Instead,
  # copy-pr-bot mirrors trusted PRs to pull-request/<n> and we trigger on that
  # push (config: .github/copy-pr-bot.yaml).
  #
  # No paths: filter. GitHub applies one paths list to every branch in this
  # push block, and copy-pr-bot creates pull-request/<n> at an existing SHA,
  # which often has no path changes and would skip the workflow.
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -eou pipefail {0}
    working-directory: cutile-rs

jobs:
  # Exercise the oldest Tile IR assembler, including its lack of
  # --list-versions. The separate 13.0 lane only checks shared host crates.
  tile-ir-cuda13-2:
    runs-on: linux-amd64-cpu16
    container:
      image: nvidia/cuda:13.2.0-devel-ubuntu24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CUDA_TOOLKIT_PATH: /usr/local/cuda
      CUTILE_TILEIRAS_PATH: /usr/local/cuda/bin/tileiras
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./cutile-rs/.github/actions/setup
      - name: Verify assembler
        run: |
          "$CUTILE_TILEIRAS_PATH" --version
          "$CUTILE_TILEIRAS_PATH" --help | grep -q 'sm_120'
      - name: CPU and assembler tests
        run: ./scripts/run_cpu_tests.sh
      - name: Standalone bytecode example
        run: cargo run -p cutile-ir --example build_basic

  # Newest Tile IR assembler: the 13.4 gates in the compiler and encoder must
  # pass here and refuse correctly on the 13.2 lane above. The dev image may
  # ship the toolkit without the assembler package; install it when missing.
  tile-ir-cuda13-4:
    runs-on: linux-amd64-cpu16
    container:
      image: nvidia/cuda:13.4.1-devel-ubuntu24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CUDA_TOOLKIT_PATH: /usr/local/cuda
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./cutile-rs/.github/actions/setup
      - name: Verify assembler version
        run: |
          command -v tileiras || apt-get install -y -qq --no-install-recommends cuda-tileiras-13-4
          tileiras --version
          tileiras --list-versions | grep -q '13.4'
      - name: CPU and assembler tests
        run: ./scripts/run_cpu_tests.sh

  build:
    runs-on: linux-amd64-cpu16
    container:
      image: nvidia/cuda:13.3.0-devel-ubuntu24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CUDA_TOOLKIT_PATH: /usr/local/cuda
    timeout-minutes: 30
    steps:
      # Before checkout, so this cannot use the cutile-rs working directory.
      - name: Verify CUDA toolchain
        working-directory: ${{ github.workspace }}
        run: |
          nvcc --version
          command -v tileiras
          tileiras --help | grep -q "sm_120"

      - uses: actions/checkout@v7
      - uses: ./cutile-rs/.github/actions/setup

      # Cheapest checks first so a formatting or lint slip fails in seconds.
      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        # cuda-tile-rs is outside default-members (its build compiles LLVM); keep it out of clippy too.
        run: cargo clippy --workspace --exclude cuda-tile-rs --all-targets

      - name: TileIR toolchain smoke test
        run: cargo test -p cutile-ir --test bytecode_validate simple_arithmetic -- --exact --nocapture

      # Compiles every lib, bin, test and example target once; the test script
      # below then reuses those artifacts. (`cargo build` would be a subset.)
      - name: Compile all targets
        run: cargo test --no-run

      - name: CPU only tests
        run: ./scripts/run_cpu_tests.sh

      # nextest archives carry test executables, Cargo metadata, and build
      # outputs needed to run on another machine without rebuilding Rust.
      # Keep both workspaces separate, then bundle them in one downloadable tar.
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.146 --locked

      - name: Archive Tile runtime test packages
        run: |
          mkdir -p "$RUNNER_TEMP/cutile-gpu-tests"
          cargo nextest archive --locked --features experimental-tune \
            --archive-file "$RUNNER_TEMP/cutile-gpu-tests/tile-tests.tar.zst"

      - name: Archive shared-host runtime test packages
        working-directory: ${{ github.workspace }}
        run: |
          cargo nextest archive --locked \
            -p cuda-bindings -p cuda-core -p cuda-async \
            --archive-file "$RUNNER_TEMP/cutile-gpu-tests/host-tests.tar.zst"

      - name: Bundle runtime test archives
        run: |
          cp "$(command -v cargo-nextest)" "$RUNNER_TEMP/cutile-gpu-tests/cargo-nextest"
          git rev-parse HEAD > "$RUNNER_TEMP/cutile-gpu-tests/revision.txt"
          cargo nextest --version > "$RUNNER_TEMP/cutile-gpu-tests/nextest-version.txt"
          tar -cf "$RUNNER_TEMP/cutile-gpu-tests.tar" \
            -C "$RUNNER_TEMP/cutile-gpu-tests" .

      - name: Upload runtime test packages
        uses: actions/upload-artifact@v4
        with:
          name: cutile-gpu-tests
          path: ${{ runner.temp }}/cutile-gpu-tests.tar
          if-no-files-found: error
          compression-level: 0 # The nested nextest archives are already compressed.
          retention-days: 7

  gpu-tests:
    needs: build
    runs-on: nv-gpu-amd64-rtxpro6000-1gpu
    timeout-minutes: 30
    container:
      image: nvidia/cuda:13.3.0-devel-ubuntu24.04
      options: -u root --security-opt seccomp=unconfined --shm-size 16g
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
    env:
      CUDA_TOOLKIT_PATH: /usr/local/cuda
      CUTILE_TILEIRAS_PATH: /usr/local/cuda/bin/tileiras
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: cutile-gpu-tests
          path: ${{ runner.temp }}/gpu-tests

      - name: Extract runtime test packages
        run: |
          tar -xf "$RUNNER_TEMP/gpu-tests/cutile-gpu-tests.tar" -C "$RUNNER_TEMP/gpu-tests"
          test "$(cat "$RUNNER_TEMP/gpu-tests/revision.txt")" = "$GITHUB_SHA"
          echo "$RUNNER_TEMP/gpu-tests" >> "$GITHUB_PATH"
          nvidia-smi
          "$CUTILE_TILEIRAS_PATH" --version

      # Mirror scripts/run_gpu_tests.sh's runtime selection. Archive mode uses
      # the checked-out sources for fixtures and remaps the two workspace roots.
      # Serial execution prevents unrelated GPU tests competing for resources.
      - name: Tile GPU runtime tests
        run: |
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/gpu-tests/tile-tests.tar.zst" \
            --workspace-remap "$PWD" --test-threads 1 --no-fail-fast \
            -E 'package(=cutile) & (
              binary(/^(arange|autotune|do_bench|dtype_float_ops|gpu_execution_ops|nested_partition_mut|slice_non_divisible|tensor_reinterpret|tensor_views|warmup_suite|gpu)$/)
              | (binary(=control_flow_ops) & not test(compile_))
              | (binary(/^(tensor_and_matrix_ops|type_conversion_ops)$/) & test(execute_))
              | (binary(=specialization_bits) & test(raw_pointer_launch))
            )'

      - name: Submission lifetime tests (default, reactor, spin)
        run: |
          for budget in default 0 200000; do
            echo "CUDA_ASYNC_SPIN_BUDGET_US=$budget"
            if [[ "$budget" == default ]]; then
              unset CUDA_ASYNC_SPIN_BUDGET_US
            else
              export CUDA_ASYNC_SPIN_BUDGET_US="$budget"
            fi
            cargo-nextest nextest run --archive-file "$RUNNER_TEMP/gpu-tests/tile-tests.tar.zst" \
              --workspace-remap "$PWD" --test-threads 1 --no-fail-fast \
              -E 'package(=cutile) & binary(=submission_lifetimes)'
          done

      - name: Cross-file debug source kernel
        run: |
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/gpu-tests/tile-tests.tar.zst" \
            --workspace-remap "$PWD" --test-threads 1 --run-ignored only \
            -E 'package(=cutile) & binary(=debug_info) & test(=kernel_executes_in_all_debug_modes)'

      - name: Shared-host GPU runtime tests
        working-directory: ${{ github.workspace }}
        run: |
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/gpu-tests/host-tests.tar.zst" \
            --workspace-remap "$PWD" --test-threads 1 --no-fail-fast \
            -E 'package(=cuda-bindings)
              | (package(=cuda-core) & binary(/^(vmm|vmm_multicast|borrow_raw|simt_context_limits|simt_context_sync_policy|simt_device_buffer|simt_device_buffer_leaks|simt_pinned_host_buffer|simt_stream_priority|simt_stream_query|simt_vmm_multicast|simt_vmm_p2p)$/))
              | (package(=cuda-async) & (kind(lib) | binary(/^(concurrent_capture|cuda_graph|device_fault|drop_in_flight|execute_once|execution_lock|pool_allocation|reactor_correctness)$/)))'

  # Breaking API changes must ship with the right version bump: compare each
  # publishable crate's API against its latest crates.io release and fail the
  # PR when a break arrives without one (the 0.3.0 -> 0.3.1 lesson). Same
  # CUDA container as `build` because rustdoc needs the crates to compile.
  semver-checks:
    runs-on: linux-amd64-cpu16
    container:
      image: nvidia/cuda:13.3.0-devel-ubuntu24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CUDA_TOOLKIT_PATH: /usr/local/cuda
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./cutile-rs/.github/actions/setup

      # Prebuilt binary instead of `cargo install` (which compiled the tool
      # from source on every run).
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-semver-checks

      - name: Check API compatibility against crates.io
        run: |
          cargo semver-checks --workspace \
            --exclude cuda-tile-rs \
            --exclude cutile-examples \
            --exclude cutile-benchmarks

  # The shared host-side crates (cuda-bindings, cuda-core, cuda-async)
  # support CUDA 13.0+, while the Tile stack requires 13.2+. This lane keeps
  # the 13.0 floor honest: compile-only, no GPU, no TileIR toolchain (13.0
  # images have no tileiras, which is exactly the point).
  shared-crates-cuda13:
    runs-on: linux-amd64-cpu16
    container:
      image: nvidia/cuda:13.0.0-devel-ubuntu24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CUDA_TOOLKIT_PATH: /usr/local/cuda
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./cutile-rs/.github/actions/setup

      - name: Check shared crates against CUDA 13.0
        run: cargo check -p cuda-bindings -p cuda-core -p cuda-async --all-targets

  # Nightly also covers cuda-core's optional native f16 support. The remaining
  # jobs use stable from rust-toolchain.toml.
  # Model-checks / sanitizers for the cuda-async completion reactor's lock-free
  # slot protocol. CPU-only, no GPU: loom explores the interleavings and weak-
  # memory outcomes, miri checks the UnsafeCell/pointer UB, ThreadSanitizer
  # samples races on the full-scale std-thread stress. All opt-in tooling —
  # never part of the default build.
  reactor-verification:
    runs-on: linux-amd64-cpu16
    container:
      image: nvidia/cuda:13.3.0-devel-ubuntu24.04
      # ThreadSanitizer must disable ASLR; the default container seccomp blocks
      # the personality() call it uses, so relax it for this job.
      options: --security-opt seccomp=unconfined
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CUDA_TOOLKIT_PATH: /usr/local/cuda
      RUSTUP_TOOLCHAIN: nightly-2026-09-16
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # This nightly must ship clippy, miri, and rust-src on x86_64.
      - uses: ./cutile-rs/.github/actions/setup
        with:
          components: clippy miri rust-src

      - name: Clippy (all features, including native f16)
        run: cargo clippy --workspace --exclude cuda-tile-rs --all-targets --all-features

      - name: Native f16 DeviceCopy
        run: cargo test -p cuda-core --features f16 --test simt_device_copy_impls

      - name: loom model check (interleavings + weak memory)
        run: RUSTFLAGS="--cfg loom" cargo test -p cuda-async --lib loom_

      - name: miri (UnsafeCell / pointer UB)
        run: cargo miri test -p cuda-async --lib slot_table

      - name: ThreadSanitizer (sampled data races, full-scale stress)
        run: |
          # setarch -R pre-disables ASLR so TSan doesn't need to re-exec itself
          # (which the container blocks); this sidesteps the high mmap-entropy
          # incompatibility on newer kernels.
          RUSTFLAGS="-Zsanitizer=thread" \
            setarch "$(uname -m)" -R \
            cargo test -p cuda-async --lib slot_table \
            -Zbuild-std --target x86_64-unknown-linux-gnu
